<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎃</title>
<!-- Image provenance: see credits.html and README.md in this repository. Memes sourced
     from public Instagram posts by @doyourememberthe2000s, @90stvshowstweets and
     @memezar (original tweet by @jnsulz), each with 50,000+ likes as of Oct 30, 2026.
     Images are embedded as data URIs in memes/meme0.js-meme3.js. -->
<style>
html, body { margin: 0; min-height: 100%; }
body { background: #17110f; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
.meme-page { max-width: 720px; width: 100%; margin: 0 auto; text-align: center; padding: 24px 16px; box-sizing: border-box; }
.meme { margin: 0 0 24px; width: 100%; }
.meme img { display: block; max-width: 100%; max-height: 72vh; width: auto; height: auto; margin: 0 auto; border-radius: 16px; }
.action { display: flex; justify-content: center; }
button { min-height: 48px; width: 100%; max-width: 320px; font-size: 17px; border-radius: 12px; border: 1px solid #d9d2cb; background: #ffffff; color: #1c1917; cursor: pointer; }
button:active { background: #f3eeea; }
button:focus-visible { outline: 3px solid #f97316; outline-offset: 4px; }
</style>
</head>
<body>
<div class="meme-page">
<figure class="meme" aria-live="polite" aria-atomic="true"><a id="memelink" href="credits.html" aria-label="image credits"><img id="meme" alt=""></a></figure>
<div class="action"><button id="next" type="button">another one</button></div>
</div>
<script src="memes/meme0.js"></script>
<script src="memes/meme1.js"></script>
<script src="memes/meme2.js"></script>
<script src="memes/meme3.js"></script>
<script>
const memes = [{"id": 0, "alt": "Tweet: I'm regretting my decision for Rufus as Halloween. Update: photo of three friends in Kim Possible group costumes, one painted pink as Rufus the naked mole rat.", "w": 701, "h": 770, "src": window.MEME_0}, {"id": 1, "alt": "Tweet: I feel sorry for kids who will never get to see the old Disney Channel shows Halloween episodes, with stills from Suite Life of Zack and Cody and other Disney Halloween specials.", "w": 1080, "h": 1349, "src": window.MEME_1}, {"id": 2, "alt": "Tweet: IT'S THEIR SEASON!!! with images of the Hex Girls, Twitches, the Hocus Pocus Sanderson sisters, and two sister witches.", "w": 1080, "h": 1349, "src": window.MEME_2}, {"id": 3, "alt": "Tweet: That's Halloween set I guess. Photos of a woman whose Halloween makeup will not come off. I gotta wear this at work.", "w": 1200, "h": 1381, "src": window.MEME_3}];
const img = document.getElementById('meme');
const link = document.getElementById('memelink');
const slugs = ["rufus","disneyhalloween","theirseason","halloweenmakeup"];
function pick(except) {
    const count = memes.length - (except < 0 ? 0 : 1);
    const values = new Uint32Array(1);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(values);
    else values[0] = Math.floor(Math.random() * 4294967296);
    const next = Math.floor(values[0] / 4294967296 * count);
    return except >= 0 && next >= except ? next + 1 : next;
}
let index = pick(-1);
function show(i) { const m = memes[i]; index = i; img.src = m.src; img.alt = m.alt; img.width = m.w; img.height = m.h; link.href = 'credits.html#' + slugs[i]; }
show(index);
document.getElementById('next').addEventListener('click', () => show(pick(index)));
</script>
</body>
</html>
