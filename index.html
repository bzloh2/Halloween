<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎃</title>
<!-- Image credits: see README.md in this repository. Sources: Oregon Department of
     Transportation (CC BY 2.0), DaPuglet (CC BY-SA 2.0), smoMashup1 (CC BY 2.0),
     inkknife_2000 (CC BY-SA 2.0), i eated a cookie (CC BY 2.0), gruntzooki (CC BY-SA 2.0),
     kurafire (CC BY 2.0), and two public-domain vintage postcards via Wikimedia Commons. -->
<style>
html, body { margin: 0; min-height: 100%; }
body { background: #17110f; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
.meme-page { max-width: 720px; width: 100%; margin: 0 auto; text-align: center; padding: 24px 16px; box-sizing: border-box; }
.meme { margin: 0 0 24px; width: 100%; }
.meme img { display: block; max-width: 100%; max-height: 72vh; width: auto; height: auto; margin: 0 auto; border-radius: 16px; }
.action { display: flex; justify-content: center; }
button { min-height: 48px; width: 100%; max-width: 320px; font-size: 17px; border-radius: 12px; border: 1px solid #d9d2cb; background: #ffffff; color: #1c1917; cursor: pointer; }
button:active { background: #f3eeea; }
button:focus-visible { outline: 3px solid #f97316; outline-offset: 4px; }
</style>
</head>
<body>
<div class="meme-page">
<figure class="meme" aria-live="polite" aria-atomic="true"><a id="memelink" href="credits.html" aria-label="image credits"><img id="meme" alt=""></a></figure>
<div class="action"><button id="next" type="button">another one</button></div>
</div>
<script>
const memes = [{"id": 0, "alt": "Pug in a pug costume. Get in touch with you're inner pug.", "w": 507, "h": 576, "src": "https://live.staticflickr.com/8514/8593117906_84a63d9993_z.jpg"}, {"id": 1, "alt": "Dog in a princess costume. Obi Wan Kenobi you're my only hope. Bitch. Please.", "w": 680, "h": 1024, "src": "https://live.staticflickr.com/8469/8120704526_9f6aace216_b.jpg"}, {"id": 2, "alt": "Pumpkin patch sign: Red Warty Thing.", "w": 1024, "h": 925, "src": "https://live.staticflickr.com/5610/15543065386_5c589ff577_b.jpg"}, {"id": 3, "alt": "Bank sign: For your safety and ours, please remove holiday masks before entering.", "w": 768, "h": 1024, "src": "https://live.staticflickr.com/2415/2089487917_ce5a8b0be4_b.jpg"}, {"id": 4, "alt": "Lawn sign: Blood drive, Halloween night only, we vant your blood!", "w": 1024, "h": 771, "src": "https://live.staticflickr.com/65535/54080170257_ae38e2447b_b.jpg"}, {"id": 5, "alt": "Cardboard protest sign: Drunk, full of candy and dressed up. I am the 99 percent.", "w": 1024, "h": 1024, "src": "https://live.staticflickr.com/7316/8730379051_3856cb375b_b.jpg"}, {"id": 6, "alt": "Kids costume package labeled Harem Girl.", "w": 375, "h": 500, "src": "https://live.staticflickr.com/2266/1809775131_8439f5c096_z.jpg"}, {"id": 7, "alt": "Halloween cake with botched icing message, a spell check fail.", "w": 500, "h": 375, "src": "https://live.staticflickr.com/2741/4059512779_5475501691_z.jpg"}, {"id": 8, "alt": "Infant Elmo costume package. Elmo swallows babies whole.", "w": 500, "h": 500, "src": "https://live.staticflickr.com/8439/7910079272_e76aa34a8f_z.jpg"}];
const img = document.getElementById('meme');
const link = document.getElementById('memelink');
const slugs = ["innerpug","ghostdog","wartypumpkin","banksign","blooddrive","occupycandy","costumebox","cake","elmo"];
function pick(except) {
    const count = memes.length - (except < 0 ? 0 : 1);
    const values = new Uint32Array(1);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(values);
    else values[0] = Math.floor(Math.random() * 4294967296);
    const next = Math.floor(values[0] / 4294967296 * count);
    return except >= 0 && next >= except ? next + 1 : next;
}
let index = pick(-1);
function show(i) { const m = memes[i]; index = i; img.src = m.src; img.alt = m.alt; img.width = m.w; img.height = m.h; link.href = 'credits.html#' + slugs[i]; }
show(index);
document.getElementById('next').addEventListener('click', () => show(pick(index)));
</script>
</body>
</html>
